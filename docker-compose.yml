services:
  db:
    image: postgres:18.1-bookworm
    container_name: ${POSTGRES_DB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - '${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql'
    networks:
      - 'sf-ai-net'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: '5s'
      timeout: '5s'
      retries: 5
      start_period: '7s'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sf-ai-app
    restart: unless-stopped
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/tmp
    networks:
      - sf-ai-net
    depends_on:
      - db

  port-forward:
    image: alpine/socat:1.8.1.3
    container_name: sf-ai-forward
    restart: always
    env_file:
      - .env
    ports:
      - '${HOSTNAME}:5433:${POSTGRES_PORT}'
    command:
      - 'tcp-listen:${POSTGRES_PORT},fork,reuseaddr'
      - 'tcp-connect:db:${POSTGRES_PORT}'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 'sf-ai-net'

  swagger:
    image: swaggerapi/swagger-ui
    container_name: sf-ai-swagger
    ports:
      - '${SWAGGER_PORT}:${SWAGGER_PORT}'
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
      SWAGGER_FILE: /docs/openapi.yaml
      PORT: '${SWAGGER_PORT}'
    networks:
      - sf-ai-net
    volumes:
      - ${PROJECT_ROOT}/docs:/docs

  pgadmin:
    image: dpage/pgadmin4
    container_name: sf-ai-pgadmin
    env_file:
      - '.env'
    ports:
      - '5050:80'
    volumes:
      - '${PROJECT_ROOT}/out/pgadmin:/var/lib/pgadmin'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 'sf-ai-net'

networks:
  sf-ai-net:
    driver: bridge
    name: sf-ai-net
